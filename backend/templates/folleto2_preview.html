<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vista previa folleto</title>
  <link rel="stylesheet" href="folleto2.css">
</head>
<body>
  <div class="container">
    <div class="encabezado">
      <img src="https://i.imgur.com/9VzSJSK.png" class="logo-centro" alt="Logo Juanita">
    </div>

    <div class="contenedor-todas-categorias">
      <div class="producto">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg" alt="Manzana">
        <div class="nombre-producto">MANZANA</div>
        <div class="nombre-secundario">apple</div>
        <div class="precio">$1.98</div>
        <div class="unidad">LB</div>
      </div>

      <div class="producto">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Orange-Fruit-Pieces.jpg" alt="Naranja">
        <div class="nombre-producto">NARANJA</div>
        <div class="nombre-secundario">orange</div>
        <div class="precio">$0.99</div>
        <div class="unidad">EA</div>
      </div>
    </div>

    <div class="footer-folleto">
      <div class="cuadro-direccion">
        <div class="direccion">340 W Grant Line, Tracy, CA</div>
        <div class="telefono">(209) 123-4567</div>
      </div>
      <div class="fecha-folleto">
        <div class="validez-texto">Precios válidos</div>
        <div class="fecha-validez">Julio 28–Agosto 2</div>
      </div>
      <div class="metodos-pago">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" style="height: 20px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/MasterCard_Logo.svg" style="height: 20px;">
      </div>
    </div>
  </div>
</body>
</html>
